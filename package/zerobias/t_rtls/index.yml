name: Real-Time Location System (RTLS)
description: >-
  Real-Time Location Systems (RTLS) track the physical position of people and
  equipment inside a facility using badges or tags carried by the tracked
  subject and fixed sensors or receivers that detect them. Position data feeds
  asset utilisation and loss prevention, workflow and process analytics, staff
  duress and safety, and contact tracing. Deployments are typically on premises,
  since the sensor network is part of the building. Common in healthcare,
  manufacturing, logistics, and warehousing.
